name: Build transfer ZIP artifact
on:
  push:
    branches: [main]
jobs:
  artifact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: Skill-Phan-Tich-Doanh-Nghiep-Transfer-v1
          path: downloads/Skill-Phan-Tich-Doanh-Nghiep-Transfer-v1.zip
          if-no-files-found: error
          retention-days: 1
